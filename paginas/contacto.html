<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponerse en contacto</title>
  <link rel="stylesheet" href="../assets/css/paginas/contacto/formulario.css">
  <link rel="stylesheet" href="../assets/css/paginas/contacto/fachada-y-mapa.css">
</head>
<body>

  <!-- MENÚ COMPARTIDO -->
  <script src="../componentes/menu.js"></script>

  <!-- CONTENIDO DEL FORMULARIO -->
  <main class="main-wrapper">
    <div class="form-container">
      <h1>Ponerse en contacto</h1>

      <form>
        <div class="form-grid">
          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Nombre">
          </div>

          <!-- Apellido -->
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" placeholder="Apellido">
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" placeholder="Email" required>
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <div class="phone-input-wrapper">
              <span class="phone-icon">
                <!-- Icono de globo terráqueo -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <!-- Icono de flecha despliegue -->
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
              <input type="tel" id="telefono" placeholder="Teléfono">
            </div>
          </div>

          <!-- Mensaje -->
          <div class="form-group full-width">
            <label for="mensaje">Mensaje *</label>
            <textarea id="mensaje" placeholder="Mensaje" required></textarea>
          </div>
        </div>

        <!-- Botón de enviar -->
        <div class="button-container">
          <button type="submit" class="submit-btn">Enviar</button>
        </div>
      </form>
    </div>
  </main>
  <script src="RUTA/componentes/menu.js"></script>

</body>
</html>
