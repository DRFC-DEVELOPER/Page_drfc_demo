<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobertura Nacional</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    /* Encabezado Superior */
    .header {
      padding: 20px 40px;
    }

    .tagline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #6b7c93;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .tagline-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .title {
      color: #2b5b84;
      font-size: 36px;
      font-weight: bold;
    }

    /* Panel Principal */
    .content-panel {
      background-color: #2e4053;
      display: flex;
      color: #ffffff;
      position: relative;
      align-items: center;
      padding: 30px 40px;
      min-height: 280px;
    }

    /* Columna Izquierda: Ubicación */
    .location-section {
      width: 35%;
      text-align: center;
      padding-right: 20px;
    }

    .pin-icon {
      width: 40px;
      height: 50px;
      background-color: #b0b7bd;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      margin: 0 auto 15px auto;
      position: relative;
    }

    .pin-icon::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 30%;
      width: 40%;
      height: 40%;
      background-color: #2e4053;
      border-radius: 50%;
    }

    .location-block {
      margin-bottom: 15px;
    }

    .location-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .location-list {
      color: #d1d8e0;
      font-size: 13px;
      line-height: 1.4;
    }

    .highlight-text {
      color: #a8c0d6;
    }

    /* Columna Derecha: Tarjeta Blanca */
    .card-section {
      width: 65%;
      position: relative;
    }

    .white-card {
      background-color: #f4f5f7;
      border-radius: 30px;
      color: #333333;
      padding: 35px 30px 35px 160px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Imagen del Trabajador con Casco superpuesta */
    .worker-image {
      position: absolute;
      left: -240px;
      bottom: -30px;
      height: 380px;
      z-index: 10;
      transform-origin: bottom center;
      transition: transform 0.3s ease;
    }

    .worker-image:hover {
      transform: scale(1.08);
    }

    @media (prefers-reduced-motion: reduce) {
      .worker-image {
        transition: none;
      }
    }

    .stats-title {
      font-size: 26px;
      color: #222222;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .stats-title strong {
      font-weight: 800;
      font-size: 30px;
    }

    .stats-description {
      color: #666666;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 20px;
      max-width: 320px;
    }

    .btn-action {
      background-color: #1c425c;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #132e42;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Sección de título -->
    <div class="header">
      <div class="tagline">
        <img src="../src/Ícono DRFC.png" alt="DRFC" class="tagline-icon">
        <span>COLABORADORES</span>
      </div>
      <h1 class="title">Cobertura nacional</h1>
    </div>

    <!-- Sección principal azul -->
    <div class="content-panel">
      
      <!-- Ubicaciones -->
      <div class="location-section">
        <div class="pin-icon"></div>
        
        <div class="location-block">
          <p class="location-title">Con base permanente en:</p>
          <p class="location-list">
            Cuernavaca<br>
            CDMX<br>
            Estado de México<br>
            Monterrey
          </p>
        </div>

        <div class="location-block">
          <p class="location-title">En apertura:</p>
          <p class="location-list">
            <span class="highlight-text">Tijuana</span> y Guadalajara
          </p>
        </div>
      </div>

      <!-- Tarjeta con imagen -->
      <div class="card-section">
        
        <img src="../src/ContratistaWeb.png" alt="Trabajador con casco" class="worker-image">
        
        <div class="white-card">
          <h2 class="stats-title">
            <strong>176</strong> Colaboradores fijos y<br>
            <strong>440</strong> de cobertura dinámica
          </h2>
          <p class="stats-description">
            Capacidad operativa que escala según el tamaño del proyecto.
          </p>
          <a href="#" class="btn-action">Trabaja con nosotros</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
