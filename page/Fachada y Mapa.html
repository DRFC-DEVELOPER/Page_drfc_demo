<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sección Fachada y Mapa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      height: 450px; /* Puedes ajustar la altura según tus necesidades */
    }

    .column {
      flex: 1;
      min-width: 300px;
      height: 100%;
    }

    /* Ajuste para la foto */
    .column img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Ajuste para el mapa de Google */
    .column iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Responsivo para pantallas pequeñas */
    @media (max-width: 768px) {
      .container {
        height: auto;
      }
      .column {
        height: 350px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Columna Izquierda: Fotografía -->
    <div class="column">
      <img src="../src/Fachada.jpg" alt="Fachada del edificio">
    </div>

    <!-- Columna Derecha: Mapa de Google -->
    <div class="column">
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3773.330715125233!2d-99.22531409999999!3d18.9609964!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cde1f0283fc9cb%3A0x2c5d00c3af127c5b!2sDRFC%20Ingenier%C3%ADa!5e0!3m2!1ses-419!2smx!4v1792078042039!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>

</body>
</html>
