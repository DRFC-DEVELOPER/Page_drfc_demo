<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef3f6">
    <title>Contacto | DRFC Ingeniería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --drfc-icon-size: clamp(2rem, 3vw, 3rem);
            font-family: Inter, Arial, sans-serif;
            color: #253746;
            background: #eef3f6;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: clamp(1rem, 4vw, 3rem);
            place-items: center;
            background: #eef3f6;
        }

        .contact-card {
            position: relative;
            width: min(100%, 1400px);
            overflow: hidden;
            padding: clamp(2rem, 6vw, 5.5rem);
            border: 1px solid #dbe5eb;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(0, 45, 67, 0.08);
            text-align: center;
        }

        .contact-card::before {
            position: absolute;
            inset: 0 0 auto;
            height: 5px;
            background: linear-gradient(90deg, #003e58, #318bb1);
            content: "";
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            margin: 0 0 1.5rem;
            color: #5a6b7c;
            font-size: clamp(0.75rem, 0.9vw, 1.125rem);
            font-weight: 500;
            letter-spacing: clamp(0.08rem, 0.12vw, 0.15rem);
            line-height: 1.5;
            text-transform: uppercase;
        }

        .eyebrow-mark {
            display: block;
            width: var(--drfc-icon-size);
            height: var(--drfc-icon-size);
            flex: 0 0 var(--drfc-icon-size);
            object-fit: contain;
        }

        .fiber-connection {
            display: flex;
            width: min(100%, 780px);
            height: 1.25rem;
            align-items: center;
            margin: 1.25rem auto 0;
        }

        .fiber-connector {
            position: relative;
            width: 1rem;
            height: 0.75rem;
            flex: 0 0 auto;
            border: 1px solid #5a6b7c;
            border-radius: 3px;
            background: #fff;
        }

        .fiber-connector::after {
            position: absolute;
            top: 50%;
            width: 0.25rem;
            height: 0.25rem;
            border: 1px solid #318bb1;
            border-radius: 50%;
            background: #eef5f8;
            content: "";
            transform: translateY(-50%);
        }

        .fiber-connector:first-child::after {
            right: 1px;
        }

        .fiber-connector:last-child::after {
            left: 1px;
        }

        .fiber-cable {
            position: relative;
            height: 2px;
            flex: 1;
            overflow: hidden;
            background: #cbdde6;
        }

        .fiber-cable::after {
            position: absolute;
            top: 50%;
            left: -1.5rem;
            width: 1.5rem;
            height: 2px;
            background: #318bb1;
            content: "";
            opacity: 0.85;
            animation: fiber-signal 3.2s ease-in-out infinite;
        }

        @keyframes fiber-signal {
            0% {
                opacity: 0;
            }
            15%, 75% {
                opacity: 0.85;
            }
            100% {
                left: calc(100% - 1.5rem);
                opacity: 0;
            }
        }

        h1 {
            max-width: 780px;
            margin: 0 auto;
            color: #253746;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            letter-spacing: -0.045em;
            line-height: 1.15;
        }

        .description {
            max-width: 620px;
            margin: 1.25rem auto 2rem;
            color: #5a6b7c;
            font-size: clamp(1rem, 2vw, 1.125rem);
            font-weight: 400;
            line-height: 1.7;
        }

        .contact-link {
            display: inline-flex;
            min-height: 3.25rem;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.8rem 1.5rem;
            border: 1px solid #003e58;
            border-radius: 8px;
            background: #003e58;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 160ms ease, border-color 160ms ease;
        }

        .contact-link:hover {
            border-color: #26799c;
            background: #26799c;
        }

        .contact-link:focus-visible {
            outline: 3px solid #8cc6dc;
            outline-offset: 3px;
        }

        .contact-link svg {
            width: 1rem;
            height: 1rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .fiber-cable::after {
                animation: none;
                left: calc(50% - 0.75rem);
                opacity: 0.85;
            }
        }

        @media (max-width: 480px) {
            .contact-card {
                border-radius: 14px;
            }

            .eyebrow {
                font-size: 0.8125rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="contact-card">
        <p class="eyebrow">
            <img class="eyebrow-mark" src="../src/Ícono DRFC.png" alt="">
            Te ayudamos a expandir tu red
        </p>
        <h1>Agendemos una reunión técnica para evaluar tu próximo despliegue</h1>
        <div class="fiber-connection" role="img" aria-label="Señal de fibra óptica conectando dos terminales">
            <span class="fiber-connector"></span>
            <span class="fiber-cable"></span>
            <span class="fiber-connector"></span>
        </div>
        <p class="description">En DRFC estamos comprometidos con entregar calidad en cada uno de nuestros trabajos</p>
        <a class="contact-link" href="mailto:contacto@drfc.com.mx">
            Contacto
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
            </svg>
        </a>
    </main>
</body>
</html>
