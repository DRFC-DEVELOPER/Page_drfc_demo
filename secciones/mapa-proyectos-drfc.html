<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de proyectos DRFC</title>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
  :root{
    --slate:#293a4a;
    --slate-2:#1f4458;
    --azul:#1a73c8;
    --texto:#2b3640;
    --suave:#6b7885;
    --linea:#d9dfe5;
    --fondo-mapa:#f3f5f7;
    --pais:#e4e9ee;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Questrial',Arial,sans-serif;color:var(--texto);background:transparent}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  h2{margin:0 0 4px;font-size:26px;font-weight:400;color:var(--slate);letter-spacing:.3px}
  .sub{margin:0 0 14px;color:var(--suave);font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{font:inherit;font-size:13px;letter-spacing:.4px;text-transform:uppercase;padding:7px 14px;border:1px solid var(--linea);background:#fff;color:var(--slate);border-radius:999px;cursor:pointer}
  .chip:hover{border-color:var(--slate)}
  .chip.on{background:var(--slate);border-color:var(--slate);color:#fff}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
  .mapa{position:relative;background:var(--fondo-mapa);border:1px solid var(--linea);border-radius:6px;overflow:hidden}
  .mapa svg{display:block;width:100%;height:auto}
  .tip{position:absolute;pointer-events:none;background:var(--slate);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-135%);display:none}
  .lado{display:flex;flex-direction:column;gap:12px}
  .nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .num{background:var(--slate);color:#fff;border-radius:6px;padding:12px 14px}
  .num b{display:block;font-size:28px;font-weight:400;line-height:1.1}
  .num span{font-size:12px;letter-spacing:.5px;text-transform:uppercase;opacity:.8}
  .detalle{border:1px solid var(--linea);border-radius:6px;padding:14px;background:#fff;flex:1;min-height:150px}
  .detalle h3{margin:0 0 2px;font-size:18px;font-weight:400;color:var(--slate-2)}
  .detalle .est{margin:0 0 10px;font-size:13px;color:var(--suave)}
  .tag{display:inline-block;font-size:12px;letter-spacing:.3px;text-transform:uppercase;background:#e8f1fb;color:#14518f;padding:3px 9px;border-radius:3px;margin:0 6px 6px 0}
  .vacio{margin:0;font-size:14px;color:var(--suave)}
  .lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px 28px;margin-top:26px}
  .lista h4{margin:0 0 6px;font-size:16px;letter-spacing:.5px;text-transform:uppercase;color:var(--slate-2);font-family:Arial,sans-serif;font-weight:700}
  .lista p{margin:0;font-size:15px;line-height:1.6;color:var(--texto)}
  .lista a{color:inherit;text-decoration:none;cursor:pointer}
  .lista a:hover{color:var(--azul);text-decoration:underline}
  .oculto{display:none}
  @media(max-width:720px){.grid{grid-template-columns:1fr}h2{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <h2>Compromiso en cada proyecto</h2>
  <p class="sub">Presencia operativa en distintas regiones de la República Mexicana.</p>
  <div class="chips" id="chips"></div>
  <div class="grid">
    <div class="mapa">
      <svg id="mapa" viewBox="0 0 760 500" role="img" aria-label="Mapa de México con las ciudades donde se han realizado proyectos"></svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="lado">
      <div class="nums">
        <div class="num"><b id="nCiudades">0</b><span>Ciudades</span></div>
        <div class="num"><b id="nEstados">0</b><span>Estados</span></div>
      </div>
      <div class="detalle" id="detalle"></div>
    </div>
  </div>
  <div class="lista" id="lista"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
/* ============================================================
   EDITA AQUÍ: tipos de proyecto y ciudades
   ============================================================ */
var PROYECTOS = {
  "Reconstrucción": ["Acapulco","Monterrey","Cd. Juárez","Aguascalientes","Cuernavaca","Tijuana","Tecate","CDMX"],
  "Construcción": ["Cuautla","Coatzacoalcos","Linares","Monterrey","Durango","San Luis Río Colorado","Villahermosa","CDMX","Mazatlán","Puebla","Tehuacán","Guadalajara","Toluca","Acapulco","Chihuahua","Nogales"],
  "Inmobiliarios": ["Monterrey"],
  "Obra civil": ["Acapulco","Salamanca","San Luis Río Colorado","Monterrey","Aguascalientes","Manzanillo","Nogales"],
  "Obras inducidas": ["Querétaro","San Luis Río Colorado","Nogales"],
  "Desmontaje de red": ["Monterrey","Querétaro"]
};

/* [latitud, longitud, estado]  — si agregas una ciudad nueva, agrégala aquí también */
var CIUDADES = {
  "Acapulco":[16.8531,-99.8237,"Guerrero"],
  "Monterrey":[25.6866,-100.3161,"Nuevo León"],
  "Cd. Juárez":[31.6904,-106.4245,"Chihuahua"],
  "Aguascalientes":[21.8853,-102.2916,"Aguascalientes"],
  "Cuernavaca":[18.9242,-99.2216,"Morelos"],
  "Tijuana":[32.5149,-117.0382,"Baja California"],
  "Tecate":[32.5672,-116.6251,"Baja California"],
  "CDMX":[19.4326,-99.1332,"Ciudad de México"],
  "Cuautla":[18.8120,-98.9544,"Morelos"],
  "Coatzacoalcos":[18.1500,-94.4333,"Veracruz"],
  "Linares":[24.8594,-99.5683,"Nuevo León"],
  "Durango":[24.0277,-104.6532,"Durango"],
  "San Luis Río Colorado":[32.4563,-114.7717,"Sonora"],
  "Salamanca":[20.5730,-101.1950,"Guanajuato"],
  "Manzanillo":[19.0514,-104.3188,"Colima"],
  "Nogales":[31.3086,-110.9422,"Sonora"],
  "Querétaro":[20.5888,-100.3899,"Querétaro"],
  "Villahermosa":[17.9892,-92.9475,"Tabasco"],
  "Mazatlán":[23.2494,-106.4111,"Sinaloa"],
  "Puebla":[19.0414,-98.2063,"Puebla"],
  "Tehuacán":[18.4667,-97.3926,"Puebla"],
  "Guadalajara":[20.6597,-103.3496,"Jalisco"],
  "Toluca":[19.2826,-99.6557,"Estado de México"],
  "Chihuahua":[28.6353,-106.0889,"Chihuahua"]
};
/* ============================================================ */

var TIPOS = Object.keys(PROYECTOS);
var activo = "Todos";
var seleccion = null;

/* ciudad -> lista de tipos */
var porCiudad = {};
TIPOS.forEach(function(t){
  PROYECTOS[t].forEach(function(c){
    (porCiudad[c] = porCiudad[c] || []).push(t);
  });
});

function visibles(){
  return Object.keys(porCiudad).filter(function(c){
    return CIUDADES[c] && (activo === "Todos" || porCiudad[c].indexOf(activo) > -1);
  });
}

function pintarChips(){
  var el = document.getElementById("chips");
  el.innerHTML = "";
  ["Todos"].concat(TIPOS).forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip" + (t === activo ? " on" : "");
    b.textContent = t;
    b.onclick = function(){ activo = t; seleccion = null; pintarChips(); pintarLista(); pintarMarcadores(); pintarDetalle(); };
    el.appendChild(b);
  });
}

function pintarLista(){
  var el = document.getElementById("lista");
  el.innerHTML = "";
  TIPOS.forEach(function(t){
    if (activo !== "Todos" && activo !== t) return;
    var d = document.createElement("div");
    var h = document.createElement("h4"); h.textContent = t; d.appendChild(h);
    var p = document.createElement("p");
    PROYECTOS[t].forEach(function(c, i){
      var a = document.createElement("a");
      a.textContent = c;
      a.onclick = function(){ seleccionar(c); };
      p.appendChild(a);
      if (i < PROYECTOS[t].length - 1) p.appendChild(document.createTextNode(", "));
    });
    d.appendChild(p);
    el.appendChild(d);
  });
}

function pintarDetalle(){
  var el = document.getElementById("detalle");
  if (!seleccion){
    el.innerHTML = '<p class="vacio">Selecciona un punto del mapa para ver la ciudad y los tipos de proyecto realizados.</p>';
    return;
  }
  var tags = porCiudad[seleccion].map(function(t){ return '<span class="tag">'+t+'</span>'; }).join("");
  el.innerHTML = '<h3>'+seleccion+'</h3><p class="est">'+CIUDADES[seleccion][2]+'</p>'+tags;
}

function seleccionar(c){
  seleccion = c;
  if (activo !== "Todos" && porCiudad[c].indexOf(activo) === -1){ activo = "Todos"; pintarChips(); pintarLista(); }
  pintarMarcadores(); pintarDetalle();
}

function pintarContadores(){
  var v = visibles();
  document.getElementById("nCiudades").textContent = v.length;
  var est = {};
  v.forEach(function(c){ est[CIUDADES[c][2]] = 1; });
  document.getElementById("nEstados").textContent = Object.keys(est).length;
}

var svg = d3.select("#mapa");
var proj = null;
var capa = null;
var tip = document.getElementById("tip");

function pintarMarcadores(){
  pintarContadores();
  if (!proj) return;
  capa.selectAll("*").remove();
  visibles().forEach(function(c){
    var p = proj([CIUDADES[c][1], CIUDADES[c][0]]);
    var on = seleccion === c;
    var g = capa.append("g").style("cursor","pointer");
    g.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r", on ? 18 : 13).attr("fill","#1a73c8").attr("opacity",0.18);
    g.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r", on ? 8 : 6).attr("fill", on ? "#293a4a" : "#1a73c8").attr("stroke","#fff").attr("stroke-width",2);
    g.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",16).attr("fill","transparent")
      .on("mouseenter", function(){
        var r = svg.node().getBoundingClientRect();
        var k = r.width / 760;
        tip.textContent = c; tip.style.display = "block";
        tip.style.left = (p[0]*k) + "px"; tip.style.top = (p[1]*k) + "px";
      })
      .on("mouseleave", function(){ tip.style.display = "none"; })
      .on("click", function(){ seleccionar(c); });
  });
}

pintarChips(); pintarLista(); pintarDetalle(); pintarContadores();

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(function(w){
  var mx = topojson.feature(w, w.objects.countries).features.filter(function(d){ return d.id === "484"; })[0];
  proj = d3.geoMercator().fitExtent([[14,14],[746,486]], mx);
  svg.append("path").attr("d", d3.geoPath(proj)(mx)).attr("fill","#e4e9ee").attr("stroke","#9aa7b4").attr("stroke-width",1);
  capa = svg.append("g");
  pintarMarcadores();
}).catch(function(){
  document.querySelector(".mapa").innerHTML = '<p class="vacio" style="padding:24px">No se pudo cargar el mapa. La lista de ciudades sigue disponible abajo.</p>';
});
</script>
</body>
</html>
