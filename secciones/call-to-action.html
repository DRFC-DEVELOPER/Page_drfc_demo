<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construye tu red con nosotros - DRFC Ingeniería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/secciones/call-to-action.css">
</head>

<body id="inicio">

  <div class="fiber-divider" aria-hidden="true">
    <svg viewBox="0 0 1000 20" preserveAspectRatio="none">
      <line class="fiber-divider-base" x1="0" y1="10" x2="1000" y2="10"></line>
      <line class="fiber-divider-pulse" x1="0" y1="10" x2="1000" y2="10"></line>
    </svg>
  </div>

  <section class="fiber-cta" aria-label="Construye tu red con nosotros">
    <div class="fiber-cta-card">
      <p class="fiber-cta-eyebrow">
        <img src="../assets/img/marca/Ícono DRFC.png" alt="" class="fiber-cta-logo">
        Te ayudamos a expandir tu red
      </p>
      <h1 class="fiber-cta-title">Construye tu red con nosotros</h1>
      <div class="fiber-cta-connection" role="img" aria-label="Señal de fibra óptica conectando dos terminales">
        <span class="fiber-cta-connector"></span>
        <span class="fiber-cta-cable"></span>
        <span class="fiber-cta-connector"></span>
      </div>
      <p class="fiber-cta-description">En DRFC estamos comprometidos con entregar calidad en cada uno de nuestros trabajos</p>
      <a class="fiber-cta-contact" href="mailto:contacto@drfc.com.mx">
        Contacto
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
      </a>
    </div>
  </section>

 

  <script src="../assets/js/secciones/call-to-action.js"></script>

</body>
</html>
