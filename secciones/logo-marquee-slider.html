<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinta de Logos en Movimiento Infinito</title>
  <!-- Google Fonts Inter for clean typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=display" rel="stylesheet">
  
  <link rel="stylesheet" href="../assets/css/secciones/logo-marquee-slider.css">
</head>
<body>

  <!-- SECCIÓN PRINCIPAL DEL CARRUSEL -->
  <section class="logo-marquee-section">
    <div class="marquee-container" id="marqueeContainer">
      <!-- EL MARQUEE-TRACK CONTIENE 2 GRUPOS IDÉNTICOS DE 8 LOGOS PARA EL BUCLE INFINITO SINFÍN -->
      <div class="marquee-track" id="marqueeTrack">
        
        <!-- ======================================================
             GRUPO 1: 8 LOGOS ORIGINALES
             ====================================================== -->
        
        <!-- LOGO 1 -->
        <div class="logo-item" title="Logo 1">
          <!-- REEMPLAZA EL 'src' CON LA RUTA DE TU IMAGEN O SVG -->
          <img src="../assets/img/clientes/Cablecom BN.png" alt="Cablecom">
        </div>

        <!-- LOGO 2 -->
        <div class="logo-item" title="Logo 2">
          <img src="../assets/img/clientes/Cablemas BN.png" alt="Cablemás">
        </div>

        <!-- LOGO 3 -->
        <div class="logo-item" title="Logo 3">
          <img src="../assets/img/clientes/Izzi BN.png" alt="Izzi">
        </div>

        <!-- LOGO 4 -->
        <div class="logo-item" title="Logo 4">
          <img src="../assets/img/clientes/Cablevisión BN.png" alt="Cablevisión">
        </div>

        <!-- LOGO 5 -->
        <div class="logo-item" title="Logo 5">
          <img src="../assets/img/clientes/Megacable BN.png" alt="Megacable">
        </div>

        <!-- LOGO 6 -->
        <div class="logo-item" title="Logo 6">
          <img src="../assets/img/clientes/Telecable BN.png" alt="Telecable">
        </div>

        <!-- LOGO 7 -->
        <div class="logo-item" title="Logo 7">
          <img src="../assets/img/clientes/Claro Video BN.png" alt="Claro Video">
        </div>

        <!-- LOGO 8 -->
        <div class="logo-item" title="Logo 8">
          <img src="../assets/img/clientes/Tigo Star BN.png" alt="Tigo Star">
        </div>


        <!-- ======================================================
             GRUPO 2: DUPLICADO EXACTO PARA CREAR EL EFECTO SINFÍN
             (Mantén los mismos links e imágenes del grupo de arriba)
             ====================================================== -->
        
        <!-- LOGO 1 (DUPLICADO) -->
        <div class="logo-item" title="Logo 1">
          <img src="../assets/img/clientes/Cablecom BN.png" alt="Cablecom" aria-hidden="true">
        </div>

        <!-- LOGO 2 (DUPLICADO) -->
        <div class="logo-item" title="Logo 2">
          <img src="../assets/img/clientes/Cablemas BN.png" alt="Cablemás" aria-hidden="true">
        </div>

        <!-- LOGO 3 (DUPLICADO) -->
        <div class="logo-item" title="Logo 3">
          <img src="../assets/img/clientes/Izzi BN.png" alt="Izzi" aria-hidden="true">
        </div>

        <!-- LOGO 4 (DUPLICADO) -->
        <div class="logo-item" title="Logo 4">
          <img src="../assets/img/clientes/Cablevisión BN.png" alt="Cablevisión" aria-hidden="true">
        </div>

        <!-- LOGO 5 (DUPLICADO) -->
        <div class="logo-item" title="Logo 5">
          <img src="../assets/img/clientes/Megacable BN.png" alt="Megacable" aria-hidden="true">
        </div>

        <!-- LOGO 6 (DUPLICADO) -->
        <div class="logo-item" title="Logo 6">
          <img src="../assets/img/clientes/Telecable BN.png" alt="Telecable" aria-hidden="true">
        </div>

        <!-- LOGO 7 (DUPLICADO) -->
        <div class="logo-item" title="Logo 7">
          <img src="../assets/img/clientes/Claro Video BN.png" alt="Claro Video" aria-hidden="true">
        </div>

        <!-- LOGO 8 (DUPLICADO) -->
        <div class="logo-item" title="Logo 8">
          <img src="../assets/img/clientes/Tigo Star BN.png" alt="Tigo Star" aria-hidden="true">
        </div>

      </div>
    </div>
  </section>

</body>
</html>
