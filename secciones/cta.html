<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef3f6">
    <title>Contacto | DRFC Ingeniería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/secciones/cta.css">
</head>
<body>
    <main class="contact-card">
        <p class="eyebrow">
            <img class="eyebrow-mark" src="../assets/img/marca/Ícono DRFC.png" alt="">
            Te ayudamos a expandir tu red
        </p>
        <h1>Agendemos una reunión técnica para evaluar tu próximo despliegue</h1>
        <div class="fiber-connection" role="img" aria-label="Señal de fibra óptica conectando dos terminales">
            <span class="fiber-connector"></span>
            <span class="fiber-cable"></span>
            <span class="fiber-connector"></span>
        </div>
        <p class="description">En DRFC estamos comprometidos con entregar calidad en cada uno de nuestros trabajos</p>
        <a class="contact-link" href="mailto:contacto@drfc.com.mx">
            Contacto
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
            </svg>
        </a>
    </main>
</body>
</html>
