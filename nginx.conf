server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain text/xml;

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location ~* \.html$ {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(?:css|js|ico|jpe?g|png|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
